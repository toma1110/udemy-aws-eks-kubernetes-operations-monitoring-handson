apiVersion: apps/v1
kind: Deployment
metadata:
  name: baseline-web
  namespace: udemy4-c010-s2-baseline
  labels:
    app.kubernetes.io/name: baseline-web
    app.kubernetes.io/part-of: udemy4-c010
    app.kubernetes.io/managed-by: udemy4
    udemy4.example/lab: s2-baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: baseline-web
      udemy4.example/lab: s2-baseline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baseline-web
        app.kubernetes.io/part-of: udemy4-c010
        app.kubernetes.io/managed-by: udemy4
        udemy4.example/lab: s2-baseline
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: baseline-web
          image: public.ecr.aws/docker/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /tmp/www
              printf 'ok\n' >/tmp/www/index.html
              echo "baseline-started"
              httpd -p 8080 -h /tmp/www
              while true; do
                echo "baseline-heartbeat"
                sleep 30
              done
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
