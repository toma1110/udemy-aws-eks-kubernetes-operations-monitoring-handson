apiVersion: v1
kind: Pod
metadata:
  name: udemy4-c010-s5-20260724-pending-capacity
  namespace: udemy4-c010-s5-20260724
  labels:
    app.kubernetes.io/name: udemy4-c010-s5-20260724-pending-capacity
    app.kubernetes.io/managed-by: udemy4
    udemy4.example/scenario: pending-capacity
spec:
  activeDeadlineSeconds: 600
  restartPolicy: Never
  containers:
    - name: sleeper
      image: public.ecr.aws/docker/library/busybox:1.36.1
      command: ["sh", "-c", "sleep 600"]
      resources:
        requests:
          cpu: 10m
          memory: 8Gi
        limits:
          cpu: 20m
          memory: 8Gi
