apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: eks-fargate-ops-lab
  region: ap-northeast-1
tags:
  Course: c010
  Section: s3
  ManagedBy: learner
  Purpose: training
vpc:
  nat:
    gateway: Single
iam:
  withOIDC: true
fargateProfiles:
  - name: system-coredns
    selectors:
      - namespace: kube-system
        labels:
          k8s-app: kube-dns
    tags:
      Course: c010
      Section: s3
      ManagedBy: learner
      Purpose: training
  - name: ops-workloads
    selectors:
      - namespace: eks-fargate-ops
        labels:
          compute: ops-lab
    tags:
      Course: c010
      Section: s3
      ManagedBy: learner
      Purpose: training
